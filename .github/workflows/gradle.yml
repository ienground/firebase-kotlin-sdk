name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: xcode-27
          - target: testAndroidHostTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4.1.7
    - name: Xcode 27 버전 확인
      if: matrix.target == 'iosSimulatorArm64Test'
      run: |
        xcode_output="$(xcodebuild -version)"
        echo "$xcode_output"
        if ! echo "$xcode_output" | grep -Eq '^Xcode 27\.'; then
          echo "Xcode 27 환경이 필요합니다." >&2
          exit 1
        fi
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Cache Konan (Kotlin Native)
      uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-konan-
    - name: Build with Gradle
      run: ./gradlew ${{ matrix.target }}
